[workspace]
resolver = "2"
members = ["crates/csq", "crates/csq-reader"]

# Shared by both crates. Versions are deliberately not shared: the library and
# the tool release on their own schedules, which is the point of the split.
[workspace.package]
authors = ["Alexander Hörl <mail@alexanderhoerl.de>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
csq = { version = "0.3.0", path = "crates/csq", default-features = false }

# Profiles are workspace-wide; a member's own `[profile]` section is ignored.
[profile.release]
lto = "thin"
codegen-units = 1
